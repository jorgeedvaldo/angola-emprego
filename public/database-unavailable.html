<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Serviço temporariamente indisponível — Angola Emprego</title>
<!--
    Esta página é servida quando a base de dados não responde e não há cópia
    em cache para mostrar. Não pode depender do Laravel, do MySQL nem de
    nenhum ficheiro externo: tudo o que precisa está aqui dentro.
-->
<style>
    :root {
        --azul: #2557a7;
        --escuro: #1f2d3d;
        --texto: #4b5a6a;
        --borda: #e3e8ef;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background-color: #f6f8fb;
        color: var(--escuro);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
    }

    .caixa {
        width: 100%;
        max-width: 480px;
        padding: 40px 32px;
        border: 1px solid var(--borda);
        border-radius: 16px;
        background-color: #fff;
        box-shadow: 0 1px 3px rgba(16, 24, 40, .06);
        text-align: center;
    }

    .marca {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        margin-bottom: 20px;
        border-radius: 14px;
        background-color: #eef4ff;
    }

    .marca svg { width: 28px; height: 28px; stroke: var(--azul); }

    h1 {
        margin: 0 0 12px;
        font-size: 1.4rem;
        line-height: 1.3;
    }

    p {
        margin: 0 0 12px;
        color: var(--texto);
    }

    .nota {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--borda);
        font-size: .875rem;
        color: #7b8794;
    }

    .botao {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 28px;
        border-radius: 999px;
        background-color: var(--azul);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
    }

    .botao:hover { background-color: #1c4584; }

    @media (prefers-color-scheme: dark) {
        body { background-color: #0f1724; color: #e6edf6; }
        .caixa { background-color: #16202f; border-color: #26344a; }
        .marca { background-color: #1b2b47; }
        p { color: #a9b8cc; }
        .nota { border-color: #26344a; color: #8396ad; }
    }
</style>
</head>
<body>
    <main class="caixa">
        <div class="marca" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>
            </svg>
        </div>

        <h1>Serviço temporariamente indisponível</h1>

        <p>
            Estamos a realizar operações de recuperação do sistema. Algumas
            funcionalidades poderão estar temporariamente indisponíveis.
        </p>

        <p>Por favor, tente novamente dentro de alguns instantes.</p>

        <a class="botao" href="/">Tentar novamente</a>

        <p class="nota">Angola Emprego</p>
    </main>
</body>
</html>
